# EffectiveTube — full stack: PostgreSQL, Redis, S3-compatible storage
# (SeaweedFS), FastAPI app and Celery worker.
#
# One command: ./deploy.sh   (or: docker compose up -d --build)

name: effectivetube

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-EffectiveTube}
  ENV: ${ENV:-production}
  DEBUG: ${DEBUG:-false}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — run ./deploy.sh to generate .env}
  BASE_URL: ${BASE_URL:-http://localhost:8081}
  DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/app
  SYNC_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:-media}
  S3_REGION: us-east-1
  S3_USE_SSL: "false"
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  MAX_VIDEO_DURATION_SEC: ${MAX_VIDEO_DURATION_SEC:-14400}
  TRANSCODE_TARGET_HEIGHT: ${TRANSCODE_TARGET_HEIGHT:-720}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}

x-app-deps: &app-deps
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  storage:
    condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # Monolithic mode: master + volume + filer + S3 gateway in one container.
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.port=9333
      - -volume.port=8080
      - -filer.port=8888
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # S3 answers 403 to unauthenticated requests, so probe the TCP port instead.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [internal]

  migrate:
    build: .
    image: effectivetube/app:local
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment: *app-env
    depends_on:
      <<: *app-deps
    networks: [internal]
    restart: "no"

  app:
    build: .
    image: effectivetube/app:local
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --workers
      - "2"
    env_file: [.env]
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8081}:8000"
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  worker:
    build: .
    image: effectivetube/app:local
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - -Q
      - video
    env_file: [.env]
    environment: *app-env
    depends_on:
      <<: *app-deps
      migrate:
        condition: service_completed_successfully
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  storagedata:

networks:
  internal:
    driver: bridge
