{% extends "base.html" %}
{% block title %}Ошибка {{ status_code }} — {{ app_name }}{% endblock %}
{% block page %}error{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-code">{{ status_code }}</div>
  <h1>{{ message }}</h1>
  <p class="muted">Попробуйте вернуться на главную или воспользоваться поиском.</p>
  <div class="error-actions">
    <a class="btn primary" href="/">На главную</a>
    <a class="btn ghost" href="/results">Поиск</a>
  </div>
</div>
{% endblock %}
